# When a release is published on GitHub, builds the snap for amd64 and arm64
# and attaches both files to that release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  snap:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.snap }}" --clobber
